name: Verify rolling Codex ACP updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      codex_acp_version:
        description: Official Codex ACP npm version (blank uses latest)
        required: false
        default: ""
      codex_version:
        description: OpenAI Codex npm version (blank uses latest)
        required: false
        default: ""

concurrency:
  group: codex-acp-rolling-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout OmniHarness
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current official adapter and Codex
        shell: bash
        env:
          REQUESTED_ACP_VERSION: ${{ inputs.codex_acp_version }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          acp_version="${REQUESTED_ACP_VERSION:-latest}"
          codex_version="${REQUESTED_CODEX_VERSION:-latest}"
          npm install --prefix .rolling-codex-acp \
            "@agentclientprotocol/codex-acp@$acp_version" \
            "@openai/codex@$codex_version"

      - name: Verify adapter, Codex, and model discovery
        shell: bash
        run: |
          export PATH="$PWD/.rolling-codex-acp/node_modules/.bin:$PATH"
          codex-acp --version
          codex --version
          codex debug models > models.json
          node -e '
            const catalog = require("./models.json");
            if (!Array.isArray(catalog.models) || catalog.models.length === 0) {
              throw new Error("Codex returned no models");
            }
            const visible = catalog.models.filter((model) => !["hide", "hidden"].includes(model.visibility));
            if (!visible.some((model) => model.slug === "gpt-5.6-sol")) {
              throw new Error("GPT-5.6 Sol metadata is missing from the current Codex catalog");
            }
          '
