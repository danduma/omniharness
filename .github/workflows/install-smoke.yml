name: Verify macOS installation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-install:
    name: Fresh Mac launcher
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OMNIHARNESS_AUTH_PASSWORD: macos-release-smoke-password
      OMNIHARNESS_ROOT: ${{ runner.temp }}/omniharness-install-smoke
      OMNIHARNESS_RUNNER_HOST: 127.0.0.1
      OMNIHARNESS_RUNNER_PORT: 3059
      OMNIHARNESS_BRIDGE_URL: http://127.0.0.1:17809
      OMNIHARNESS_OPEN_BROWSER: 0
      OMNIHARNESS_SKIP_RECOMMENDED_TOOLS: 1
      OMNIHARNESS_CODEX_ACP_INSTALL: npm
      OMNIHARNESS_CODEX_ACP_NPM_ROOT: ${{ runner.temp }}/omniharness-codex-acp
      OMNIHARNESS_CODEX_ACP_INSTALL_DIR: ${{ runner.temp }}/omniharness-bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup supported Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Confirm this is a fresh interface install
        run: test ! -e dist/interface/.build-state.json

      - name: Start through the real Mac launcher
        run: |
          ./omniharness > "$RUNNER_TEMP/omniharness-install.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/omniharness-install.pid"

      - name: Wait for API health
        run: |
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 120_000;
          const url = "http://127.0.0.1:3059/api/healthz";
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url);
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 750));
          }
          throw new Error(`Timed out waiting for ${url}`);
          NODE

      - name: Verify production interface and build marker
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const origin = "http://127.0.0.1:3059";
          const response = await fetch(origin);
          if (!response.ok) throw new Error(`Interface returned ${response.status}`);
          const html = await response.text();
          if (!html.includes("OmniHarness")) throw new Error("Response is not the OmniHarness interface");
          const assetPath = html.match(/(?:src|href)=["'](\/assets\/[^"'#?]+)["']/)?.[1];
          if (!assetPath) throw new Error("Interface HTML references no hashed asset");
          const assetResponse = await fetch(new URL(assetPath, origin));
          if (!assetResponse.ok) throw new Error(`Interface asset returned ${assetResponse.status}: ${assetPath}`);
          const marker = JSON.parse(fs.readFileSync("dist/interface/.build-state.json", "utf8"));
          if (marker.version !== 1 || !/^[a-f0-9]{64}$/.test(marker.fingerprint)) {
            throw new Error("Interface build marker is invalid");
          }
          NODE

      - name: Verify the published Codex ACP installation
        run: |
          test -x "$OMNIHARNESS_CODEX_ACP_INSTALL_DIR/codex-acp"
          PATH="$OMNIHARNESS_CODEX_ACP_INSTALL_DIR:$PATH" codex-acp --version
          node -e 'process.stdout.write(require(process.argv[1]).version)' \
            "$OMNIHARNESS_CODEX_ACP_NPM_ROOT/node_modules/@agentclientprotocol/codex-acp/package.json"
          node -e 'process.stdout.write(require(process.argv[1]).version)' \
            "$OMNIHARNESS_CODEX_ACP_NPM_ROOT/node_modules/@openai/codex/package.json"
          if grep -E 'cargo install|building Docker image' "$RUNNER_TEMP/omniharness-install.log"; then
            echo "ACP setup compiled an adapter instead of using published packages." >&2
            exit 1
          fi

      - name: Verify warm Mac restart
        run: |
          install_pid="$(cat "$RUNNER_TEMP/omniharness-install.pid")"
          kill "$install_pid"
          wait "$install_pid" 2>/dev/null || true
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 15_000;
          const url = "http://127.0.0.1:3059/api/healthz";
          while (Date.now() < deadline) {
            try {
              await fetch(url);
            } catch {
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          throw new Error(`Runner did not stop before warm restart: ${url}`);
          NODE
          ./omniharness > "$RUNNER_TEMP/omniharness-warm-restart.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/omniharness-install.pid"
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 120_000;
          const url = "http://127.0.0.1:3059/api/healthz";
          while (Date.now() < deadline) {
            try {
              const response = await fetch(url);
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 750));
          }
          throw new Error(`Timed out waiting for warm restart: ${url}`);
          NODE
          grep -F "Production interface is current" "$RUNNER_TEMP/omniharness-warm-restart.log"
          if grep -F "Building production interface" "$RUNNER_TEMP/omniharness-warm-restart.log"; then
            echo "Warm restart rebuilt an unchanged production interface." >&2
            exit 1
          fi

      - name: Show launcher log on failure
        if: failure()
        run: |
          test ! -f "$RUNNER_TEMP/omniharness-install.log" || tail -n 300 "$RUNNER_TEMP/omniharness-install.log"
          test ! -f "$RUNNER_TEMP/omniharness-warm-restart.log" || tail -n 300 "$RUNNER_TEMP/omniharness-warm-restart.log"

      - name: Upload launcher log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-install-log
          path: |
            ${{ runner.temp }}/omniharness-install.log
            ${{ runner.temp }}/omniharness-warm-restart.log

      - name: Stop isolated runner
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/omniharness-install.pid"; then
            install_pid="$(cat "$RUNNER_TEMP/omniharness-install.pid")"
            if test -n "$install_pid" && kill -0 "$install_pid" 2>/dev/null; then
              kill "$install_pid"
              wait "$install_pid" 2>/dev/null || true
            fi
          fi
